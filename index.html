<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FF7A45" />


    <title>Online-Marketing-Agentur für Inhaber &amp; KMU | NEO THE AGENCY</title>
    <meta
      name="description"
      content="Online-Marketing-Agentur für Inhaber und Mittelstand: SEO, KI-Suche, Google Ads, Social Media und Websites aus einer Hand. Ziel: Seite 1 bei Google in 90 Tagen."
    />
    <link rel="canonical" href="https://www.neotheagency.de/" />

    <!-- LCP: preload the hero poster as a high-priority image. Uses a
         responsive WebP set so mobile pulls a 31KB asset, desktop a 67KB asset.
         The same image is reused as the <video poster> + CSS background-image
         on the SlideVideo, so it never re-fetches. -->
    <link
      rel="preload"
      as="image"
      href="/brand/hero-poster-mobile.webp"
      imagesrcset="/brand/hero-poster-mobile.webp 800w, /brand/hero-poster.webp 1400w"
      imagesizes="100vw"
      type="image/webp"
      fetchpriority="high"
    />

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/brand/icon-blue-n.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/icon-blue-n-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/icon-blue-n-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="NEO THE AGENCY" />
    <meta name="application-name" content="NEO THE AGENCY" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.neotheagency.de/" />
    <meta property="og:site_name" content="NEO THE AGENCY" />
    <meta property="og:title" content="Online-Marketing-Agentur für Inhaber &amp; KMU | NEO THE AGENCY" />
    <meta
      property="og:description"
      content="Online-Marketing-Agentur für Inhaber und Mittelstand: SEO, KI-Suche, Google Ads, Social Media und Websites aus einer Hand. Ziel: Seite 1 bei Google in 90 Tagen."
    />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:image" content="https://www.neotheagency.de/brand/og-cover.jpg" />
    <meta property="og:image:secure_url" content="https://www.neotheagency.de/brand/og-cover.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta property="og:image:alt" content="NEO THE AGENCY, Online-Marketing-Agentur für Websites, SEO, Google Ads und Social Media" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Online-Marketing-Agentur für Inhaber &amp; KMU | NEO THE AGENCY" />
    <meta
      name="twitter:description"
      content="Online-Marketing-Agentur für Inhaber und Mittelstand: SEO, KI-Suche, Google Ads, Social Media und Websites aus einer Hand. Ziel: Seite 1 bei Google in 90 Tagen."
    />
    <meta name="twitter:image" content="https://www.neotheagency.de/brand/og-cover.jpg" />
    <meta name="twitter:image:alt" content="NEO THE AGENCY, Online-Marketing-Agentur für Websites, SEO, Google Ads und Social Media" />

    <!-- Fonts are self-hosted (no request to Google). -->
    <link rel="stylesheet" href="/fonts/geist.css" />

    <!-- JSON-LD je Seite setzt scripts/prerender-seo.mjs aus src/content/route-meta.ts. -->
  </head>
  <body>
    <!-- LCP shell. This poster image paints before the JS bundle parses, so Lighthouse
         records LCP against the WebP poster (~31KB on mobile, ~67KB on desktop)
         instead of waiting for React to mount. Once React hydrates, the
         SlideVideo overlays this image; we then hide it so it doesn't burn CPU
         compositing under the live video. -->
    <img
      id="lcp-shell"
      width="800"
      height="518"
      src="/brand/hero-poster-mobile.webp"
      srcset="/brand/hero-poster-mobile.webp 800w, /brand/hero-poster.webp 1400w"
      sizes="100vw"
      alt=""
      aria-hidden="true"
      fetchpriority="high"
      decoding="async"
      style="position:fixed;inset:0;width:100vw;height:100svh;object-fit:cover;z-index:0;background:#05040A"
    />
    <div id="root" style="position:relative;z-index:1"></div>
    <script>
      // Drop the LCP shell once React paints the real hero. requestIdleCallback
      // gives us a frame after the SlideVideo has rendered + the poster
      // attribute has loaded, so the visual swap is invisible.
      window.addEventListener("load", function () {
        var fade = function () {
          var img = document.getElementById("lcp-shell");
          if (!img) return;
          img.style.transition = "opacity .25s ease";
          img.style.opacity = "0";
          setTimeout(function () { img && img.parentNode && img.parentNode.removeChild(img); }, 320);
        };
        ("requestIdleCallback" in window)
          ? window.requestIdleCallback(fade, { timeout: 1500 })
          : setTimeout(fade, 800);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
